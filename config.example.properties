# Copia este archivo como config.properties y completa tus datos.
# config.properties NO se sube a GitHub (está en .gitignore).

# Conexión a MySQL (usuario con privilegios mínimos, ver sql/02_usuario_bd.sql)
db.url=jdbc:mysql://localhost:3306/autodev_licencias?serverTimezone=America/Lima
db.usuario=autodev_app
db.clave=CAMBIAR

# Días antes del vencimiento en que se genera la alerta
alerta.dias=30

# Meta de ventas mensual en soles (se muestra en el Resumen)
meta.mensual=1500

# Claves de los usuarios que se crean la primera vez que se abre el sistema.
# Cámbialas antes del primer inicio.
admin.clave.inicial=CAMBIAR
vendedor.clave.inicial=CAMBIAR
